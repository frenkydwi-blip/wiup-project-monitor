<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin WIUP Project Monitor</title>
<style>
:root{--bg:#08110f;--p:#0e1b18;--p2:#13231f;--line:#243730;--t:#f5f7f6;--m:#9fb2ab;--g:#4ade80;--a:#fbbf24;--r:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,Segoe UI,Arial}.wrap{max-width:1400px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}h1{font-size:22px;margin:0}small{color:var(--m)}
.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{display:block;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}input,select,textarea{width:100%;background:#091411;border:1px solid var(--line);color:var(--t);padding:9px 10px;border-radius:9px;outline:none}textarea{min-height:64px}
button{border:1px solid var(--line);background:#153526;color:#dcfce7;padding:9px 12px;border-radius:9px;font-weight:700;cursor:pointer}.secondary{background:#101d19;color:#cbd5e1}.danger{background:#3b1717;color:#fecaca}
.status{font-size:12px;color:var(--m);margin-top:10px}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1150px}th{background:#14251f;color:#bcd0c8;font-size:11px;text-align:left;padding:10px;position:sticky;top:0}td{padding:9px;border-top:1px solid #1e302a;vertical-align:top;font-size:12px}.task{min-width:330px;font-weight:650;line-height:1.35}.w130{width:130px}.w160{width:160px}.login{max-width:520px;margin:80px auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--m);font-size:11px}
@media(max-width:800px){.wrap{padding:14px}.grid{grid-template-columns:1fr 1fr}header{align-items:flex-start;flex-direction:column}}
</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>

<div id="loginCard" class="card login" style="display:none">

<div id="app">

ya_teks": "", "pic": "Frenky", "timeline_h": 7, "status": "Belum Mulai", "status_asli": "", "deadline": "2026-09-18", "catatan": ""}, {"id": 24, "syarat": "Rekomendasi Pertimbangan Teknis Kesesuaian Tata Ruang Laut", "standar": "Jika permohonan WIUP berada di wilayah 0 – 12 mil", "keterangan": "Dibuat Mandiri", "biaya": null, "biaya_teks": "", "pic": "Frenky", "timeline_h": 7, "status": "Belum Mulai", "status_asli": "", "deadline": "2026-09-18", "catatan": ""}, {"id": 25, "syarat": "Surat Kesesuaian Tata Ruang dari Kabupaten/Kota untuk kegiatan Pertambangan", "standar": "Surat Kesesuaian Kegiatan Pemanfaatan Ruang sebagaimana diatur dalam peraturan perundang-undangan di bidang tata ruang dengan standar\na) Bagi Pelaku non-UMK, Surat Kesesuaian Tata Ruang berupa Konfirmasi Kesesuaian Kegiatan Pemanfaatan Ruang atau Persetujuan Kesesuaian Kegiatan Pemanfaatan Ruang yang diberikan dengan pertimbangan Forum Penataan Ruang; dan\nb) Bagi Pelaku UMK, Surat Kesesuaian Tata Ruang berupa Surat Pernyataan Usaha Mikro atau Usaha Kecil Terkait Tata Ruang dilengkapi dengan data pendukung berupa Informasi Kesesuaian Tata Ruang dari instansi yang berwenang di bidang tata ruang.", "keterangan": "Pengajuan PKKPR, KKPR", "biaya": 10000000.0, "biaya_teks": "", "pic": "Frenky", "timeline_h": 25, "status": "Belum Mulai", "status_asli": "", "deadline": "2026-10-06", "catatan": ""}, {"id": 26, "syarat": "Surat Pernyataan tidak keberatan/persetujuan dari Pemegang Hak Atas Tanah", "standar": "Dibuat sesuai format\nBerupa Surat Pernyataan Kesanggupan Penguasaan Hak Atas Tanah dilengkapi data persil bidang tanah dan peta tampalan persil bidang tanah dengan lokasi Permohonan WIUP yang ditandatangani oleh Pemohon WIUP di atas meterai dan diketahui oleh Kepala Desa setempat atau Notaris", "keterangan": "Peta Kepemilikan Lahan, Surat Persetujuan/ dukungan Masyarakat", "biaya": 2500000.0, "biaya_teks": "", "pic": "Frenky", "timeline_h": 25, "status": "Belum Mulai", "status_asli": "", "deadline": "2026-10-06", "catatan": ""}, {"id": 27, "syarat": "Pengawalan Proses Perizinan di ESDM", "standar": "Pemantauan dan percepatan proses perizinan di ESDM Provinsi", "keterangan": "-", "biaya": null, "biaya_teks": "Menyesuaikan", "pic": "Tendo W", "timeline_h": 60, "status": "Belum Mulai", "status_asli": "", "deadline": "2026-11-10", "catatan": ""}, {"id": 28, "syarat": "Jaminan Eksplorasi", "standar": "Setor ke BANK JATIM sesuai nomor pendaftaran", "keterangan": "Dana deposit/ disimpan di BANK", "biaya": 12500000.0, "biaya_teks": "", "pic": "Frenky", "timeline_h": 1, "status": "Belum Mulai", "status_asli": "", "deadline": "2026-09-12", "catatan": ""}]}; const cfg=window.WIUP_CONFIG||{}; let project={...EMBEDDED.project};let tasks=EMBEDDED.tasks.map(x=>({...x}));let sb=null;let cloud=false;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function loadLocal(){try{const x=JSON.parse(localStorage.getItem("wiup_admin_data")||"null");if(x){project=x.project||project;tasks=x.tasks||tasks}}catch(e){}}
function saveLocal(){localStorage.setItem("wiup_admin_data",JSON.stringify({project,tasks}))}
function render(){
 $("pname").value=project.nama||"";$("pstart").value=project.tanggal_mulai||"";$("ptarget").value=project.target_selesai||"";
 $("rows").innerHTML=tasks.map(x=>`<tr><td>${x.id}</td><td class="task">${esc(x.syarat)}</td>
 <td><input id="pic_${x.id}" value="${esc(x.pic)}"/></td>
 <td><select id="st_${x.id}"><option ${x.status==="Selesai"?"selected":""}>Selesai</option><option ${x.status==="On Progress"?"selected":""}>On Progress</option><option ${x.status==="Belum Mulai"?"selected":""}>Belum Mulai</option></select></td>
 <td><input id="h_${x.id}" type="number" min="0" value="${x.timeline_h??0}"/></td>
 <td><input id="dl_${x.id}" type="date" value="${x.deadline||""}"/></td>
 <td><textarea id="nt_${x.id}">${esc(x.catatan||"")}</textarea></td>
 <td><button onclick="saveRow(${x.id})">Simpan</button></td></tr>`).join("");
}
function getRow(id){const x=tasks.find(t=>t.id===id);x.pic=$("pic_"+id).value;x.status=$("st_"+id).value;x.timeline_h=Number($("h_"+id).value||0);x.deadline=$("dl_"+id).value;x.catatan=$("nt_"+id).value;return x}
async function saveRow(id){const x=getRow(id);if(cloud){const {error}=await sb.from("wiup_tasks").update({pic:x.pic,status:x.status,timeline_h:x.timeline_h,deadline:x.deadline,catatan:x.catatan}).eq("project_id",cfg.PROJECT_ID||1).eq("id",id);$("msg").textContent=error?"Gagal: "+error.message:"Tahap "+id+" tersimpan ke cloud.";if(!error) await loadCloud()}else{saveLocal();$("msg").textContent="Tahap "+id+" tersimpan di browser (preview lokal)."}}
async function saveProject(){project.nama=$("pname").value;project.tanggal_mulai=$("pstart").value;project.target_selesai=$("ptarget").value;if(cloud){const {error}=await sb.from("wiup_project").update({nama:project.nama,tanggal_mulai:project.tanggal_mulai,target_selesai:project.target_selesai}).eq("id",cfg.PROJECT_ID||1);$("msg").textContent=error?"Gagal: "+error.message:"Data proyek tersimpan ke cloud."}else{saveLocal();$("msg").textContent="Data proyek tersimpan di browser."}}
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+Number(n||0));return d.toISOString().slice(0,10)}
async function recalc(){project.tanggal_mulai=$("pstart").value;if(!project.tanggal_mulai)return;tasks.forEach(x=>x.deadline=addDays(project.tanggal_mulai,x.timeline_h));project.target_selesai=addDays(project.tanggal_mulai,Math.max(...tasks.map(x=>Number(x.timeline_h||0))));if(cloud){for(const x of tasks){await sb.from("wiup_tasks").update({deadline:x.deadline}).eq("project_id",cfg.PROJECT_ID||1).eq("id",x.id)}await sb.from("wiup_project").update({tanggal_mulai:project.tanggal_mulai,target_selesai:project.target_selesai}).eq("id",cfg.PROJECT_ID||1);$("msg").textContent="Deadline cloud dihitung ulang."}else{saveLocal();$("msg").textContent="Deadline preview dihitung ulang."}render()}
async function loadCloud(){const [{data:p},{data:t}]=await Promise.all([sb.from("wiup_project").select("*").eq("id",cfg.PROJECT_ID||1).single(),sb.from("wiup_tasks").select("*").eq("project_id",cfg.PROJECT_ID||1).order("id")]);if(p)project={...project,...p};if(t?.length)tasks=t;render()}
async function init(){loadLocal();render();if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){$("mode").textContent="Preview Lokal";return}
