<!doctype html><html lang="id"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin WIUP Multi Lokasi</title>
<style>
:root{--bg:#08110f;--p:#0e1b18;--p2:#13231f;--line:#243730;--t:#f5f7f6;--m:#9fb2ab;--g:#4ade80;--a:#fbbf24;--r:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,Segoe UI,Arial}.wrap{max-width:1450px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}h1{font-size:22px;margin:0}small{color:var(--m)}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}label{display:block;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}input,select,textarea{width:100%;background:#091411;border:1px solid var(--line);color:var(--t);padding:9px 10px;border-radius:9px;outline:none}textarea{min-height:64px}button{border:1px solid var(--line);background:#153526;color:#dcfce7;padding:9px 12px;border-radius:9px;font-weight:700;cursor:pointer}.secondary{background:#101d19;color:#cbd5e1}.danger{background:#3b1717;color:#fecaca}.status{font-size:12px;color:var(--m);margin-top:10px}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:1150px}th{background:#14251f;color:#bcd0c8;font-size:11px;text-align:left;padding:10px;position:sticky;top:0}td{padding:9px;border-top:1px solid #1e302a;vertical-align:top;font-size:12px}.task{min-width:330px;font-weight:650;line-height:1.35}.w130{width:130px}.w160{width:160px}.login{max-width:520px;margin:80px auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;border:1px solid var(--line);color:var(--m);font-size:11px}.locnav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.locbtn{background:#101d19;color:#cbd5e1}.locbtn.active{background:#153526;color:#dcfce7;border-color:#2f6b49}.section-title{font-size:13px;font-weight:800;margin:0 0 12px}@media(max-width:900px){.wrap{padding:14px}.grid,.grid5{grid-template-columns:1fr 1fr}header{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.grid,.grid5{grid-template-columns:1fr}}
</style><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap">
<header><div><h1>Admin • WIUP Multi Lokasi</h1><small>Kelola identitas lokasi, timeline, deadline, PIC, status dan catatan.</small></div><div class="bar"><a href="index.html" style="text-decoration:none"><button class="secondary">← Dashboard</button></a><button id="logoutBtn" class="danger" style="display:none">Keluar</button></div></header>
<div id="loginCard" class="card login" style="display:none"><h2 style="margin-top:0">Masuk Admin</h2><p style="color:var(--m);font-size:13px">Gunakan user Supabase Auth yang sudah Anda buat.</p><div style="display:grid;gap:10px"><input id="email" type="email" placeholder="Email"/><input id="password" type="password" placeholder="Password"/><button id="loginBtn">Masuk</button><div id="loginMsg" class="status"></div></div></div>
<div id="app" style="display:none">
<div class="card"><div class="bar" style="justify-content:space-between"><div><div class="section-title">Pilih Lokasi</div><div id="locNav" class="locnav"></div></div><div id="mode" class="badge">Memuat...</div></div></div>
<div class="card"><div class="section-title">Identitas Lokasi</div><div class="grid5"><div><label>Nama Lokasi</label><input id="lname"/></div><div><label>Perusahaan</label><input id="company"/></div><div><label>Komoditas</label><input id="commodity"/></div><div><label>Luas (Ha)</label><input id="area" type="number" step="0.01"/></div><div><label>PIC Utama</label><input id="mainpic"/></div></div><div class="grid" style="margin-top:10px"><div><label>Desa</label><input id="village"/></div><div><label>Kecamatan</label><input id="district"/></div><div><label>Kabupaten</label><input id="regency"/></div><div><label>Status Lokasi</label><select id="lstatus"><option>Aktif</option><option>Ditunda</option><option>Selesai</option></select></div></div><div class="grid" style="margin-top:10px"><div><label>Tanggal Mulai</label><input id="pstart" type="date"/></div><div><label>Target Selesai</label><input id="ptarget" type="date"/></div><div><label>Biaya Proses/Jasa</label><input id="servicecost" type="number"/></div><div><label>Total Dana</label><input id="totalfund" type="number"/></div></div><div class="bar" style="margin-top:12px"><button id="saveLocation">Simpan Data Lokasi</button><button id="recalc" class="secondary">Hitung Ulang Deadline dari H+</button></div><div id="msg" class="status"></div></div>
<div class="card"><div class="section-title">Workflow Lokasi Terpilih</div><div class="table"><table><thead><tr><th>No</th><th>Persyaratan</th><th class="w160">PIC</th><th class="w130">Status</th><th class="w130">H+</th><th class="w160">Deadline</th><th>Catatan</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div></div>
<script>
const cfg=window.WIUP_CONFIG||{};let sb=null,cloud=false,project=null,locations=[],tasks=[],selectedLocationId=1;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function loc(){return locations.find(x=>Number(x.id)===Number(selectedLocationId))||locations[0]}
function viewTasks(){return tasks.filter(x=>Number(x.location_id)===Number(selectedLocationId))}
function renderLocNav(){$('locNav').innerHTML=locations.slice().sort((a,b)=>(a.urutan||a.id)-(b.urutan||b.id)).map(l=>`<button class="locbtn ${Number(l.id)===Number(selectedLocationId)?'active':''}" onclick="chooseLocation(${l.id})">${esc(l.nama_lokasi||('Lokasi '+l.id))}</button>`).join('')}
function chooseLocation(id){selectedLocationId=Number(id);render()}
function render(){if(!locations.length)return;const l=loc();renderLocNav();$('lname').value=l.nama_lokasi||'';$('company').value=l.perusahaan||'';$('commodity').value=l.komoditas||'';$('area').value=l.luas_ha??'';$('mainpic').value=l.pic_utama||'';$('village').value=l.desa||'';$('district').value=l.kecamatan||'';$('regency').value=l.kabupaten||'';$('lstatus').value=l.status||'Aktif';$('pstart').value=l.tanggal_mulai||'';$('ptarget').value=l.target_selesai||'';$('servicecost').value=l.biaya_proses_jasa??0;$('totalfund').value=l.total_dana??0;$('rows').innerHTML=viewTasks().map(x=>`<tr><td>${x.id}</td><td class="task">${esc(x.syarat)}</td><td><input id="pic_${x.id}" value="${esc(x.pic)}"/></td><td><select id="st_${x.id}"><option ${x.status==='Selesai'?'selected':''}>Selesai</option><option ${x.status==='On Progress'?'selected':''}>On Progress</option><option ${x.status==='Belum Mulai'?'selected':''}>Belum Mulai</option></select></td><td><input id="h_${x.id}" type="number" min="0" value="${x.timeline_h??0}"/></td><td><input id="dl_${x.id}" type="date" value="${x.deadline||''}"/></td><td><textarea id="nt_${x.id}">${esc(x.catatan||'')}</textarea></td><td><button onclick="saveRow(${x.id})">Simpan</button></td></tr>`).join('')}
function getRow(id){const x=viewTasks().find(t=>Number(t.id)===Number(id));x.pic=$('pic_'+id).value;x.status=$('st_'+id).value;x.timeline_h=Number($('h_'+id).value||0);x.deadline=$('dl_'+id).value;x.catatan=$('nt_'+id).value;return x}
async function saveRow(id){const x=getRow(id);const {error}=await sb.from('wiup_tasks').update({pic:x.pic,status:x.status,timeline_h:x.timeline_h,deadline:x.deadline,catatan:x.catatan}).eq('project_id',cfg.PROJECT_ID||1).eq('location_id',selectedLocationId).eq('id',id);$('msg').textContent=error?'Gagal: '+error.message:'Tahap '+id+' pada '+loc().nama_lokasi+' tersimpan.';if(!error)await loadCloud()}
async function saveLocation(){const l=loc();const payload={nama_lokasi:$('lname').value,perusahaan:$('company').value,komoditas:$('commodity').value,luas_ha:$('area').value===''?null:Number($('area').value),pic_utama:$('mainpic').value,desa:$('village').value,kecamatan:$('district').value,kabupaten:$('regency').value,status:$('lstatus').value,tanggal_mulai:$('pstart').value||null,target_selesai:$('ptarget').value||null,biaya_proses_jasa:Number($('servicecost').value||0),total_dana:Number($('totalfund').value||0)};const {error}=await sb.from('wiup_locations').update(payload).eq('id',l.id).eq('project_id',cfg.PROJECT_ID||1);$('msg').textContent=error?'Gagal: '+error.message:'Data '+payload.nama_lokasi+' tersimpan.';if(!error)await loadCloud()}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+Number(n||0));return d.toISOString().slice(0,10)}
async function recalc(){const start=$('pstart').value;if(!start){$('msg').textContent='Isi tanggal mulai terlebih dahulu.';return}const vt=viewTasks(),target=addDays(start,Math.max(...vt.map(x=>Number(x.timeline_h||0))));for(const x of vt){const dl=addDays(start,x.timeline_h);const {error}=await sb.from('wiup_tasks').update({deadline:dl}).eq('project_id',cfg.PROJECT_ID||1).eq('location_id',selectedLocationId).eq('id',x.id);if(error){$('msg').textContent='Gagal: '+error.message;return}}const {error}=await sb.from('wiup_locations').update({tanggal_mulai:start,target_selesai:target}).eq('id',selectedLocationId).eq('project_id',cfg.PROJECT_ID||1);$('msg').textContent=error?'Gagal: '+error.message:'Semua deadline '+loc().nama_lokasi+' dihitung ulang.';if(!error)await loadCloud()}
async function loadCloud(){const [pr,lr,tr]=await Promise.all([sb.from('wiup_project').select('*').eq('id',cfg.PROJECT_ID||1).single(),sb.from('wiup_locations').select('*').eq('project_id',cfg.PROJECT_ID||1).order('urutan'),sb.from('wiup_tasks').select('*').eq('project_id',cfg.PROJECT_ID||1).order('location_id').order('id')]);if(pr.error||lr.error||tr.error){$('msg').textContent='Gagal memuat: '+(pr.error||lr.error||tr.error).message;return}project=pr.data;locations=lr.data||[];tasks=tr.data||[];if(!locations.some(l=>Number(l.id)===Number(selectedLocationId)))selectedLocationId=locations[0]?.id||1;render()}
async function init(){if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){$('loginCard').style.display='block';$('loginMsg').textContent='config.js belum terhubung ke Supabase.';return}sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data:{session}}=await sb.auth.getSession();if(!session){$('loginCard').style.display='block';$('app').style.display='none';return}cloud=true;$('app').style.display='block';$('mode').textContent='Realtime Supabase';$('logoutBtn').style.display='inline-block';await loadCloud();sb.channel('wiup-admin-multi').on('postgres_changes',{event:'*',schema:'public',table:'wiup_tasks'},loadCloud).on('postgres_changes',{event:'*',schema:'public',table:'wiup_locations'},loadCloud).subscribe()}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginMsg').textContent=error.message;else location.reload()};$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('saveLocation').onclick=saveLocation;$('recalc').onclick=recalc;init();
</script></body></html>
